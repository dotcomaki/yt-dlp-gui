name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pywebview needs a real GTK/WebKit2 backend on Linux (there's no
      # bundled engine the way macOS's WKWebView or Windows's WebView2
      # are built in) — same packages linux/README.md documents for a
      # real install, installed here so `import webview` succeeds
      # authentically rather than working around it.
      - name: Install pywebview's Linux backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: node --test tests/test_utils.js
