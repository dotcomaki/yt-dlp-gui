name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The sidebar's "newer version available" line compares against
      # VERSION in app.py, so a tag that disagrees with it would tell every
      # user they're out of date — or never tell them at all.
      - name: The tag and app.py's VERSION must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c "import re; print(re.search(r'^VERSION = \"([^\"]+)\"', open('app.py').read(), re.M).group(1))")"
          echo "tag=$tag  app.py VERSION=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION=$version in app.py"
            exit 1
          fi

      - name: Build the source archive
        run: |
          name="yt-dlp-gui-${GITHUB_REF_NAME}"
          # What someone extracting the release should get: the app, the
          # extensions and the installers — not the venv, git metadata, or
          # a machine-specific host manifest.
          git archive --format=tar.gz --prefix="$name/" \
            -o "$name.tar.gz" "$GITHUB_REF_NAME"
          ls -la "$name.tar.gz"
          tar -tzf "$name.tar.gz" | head -20

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="yt-dlp-gui-${GITHUB_REF_NAME}.tar.gz"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$name" --clobber
          else
            # A tag pushed without notes still produces a usable release.
            gh release create "$GITHUB_REF_NAME" "$name" --generate-notes
          fi
